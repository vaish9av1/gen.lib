{% extends 'base_admin.html' %}

{% block title %}Error{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
  <div style="text-align:center;max-width:480px;" class="reveal">
    <div style="font-size:4rem;margin-bottom:1.5rem;filter:drop-shadow(0 0 30px rgba(239,68,68,0.4));">⚠️</div>
    <h1 style="font-family:var(--font-display);font-size:1.8rem;color:#fecaca;letter-spacing:-0.02em;margin-bottom:0.8rem;">
      Something Went Wrong
    </h1>
    <p style="color:rgba(248,113,113,0.6);font-size:0.95rem;line-height:1.7;margin-bottom:2rem;">
      {{ message|default:"An unexpected error occurred. Please try again or contact your administrator." }}
    </p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="{% url 'books:book_list' %}" class="btn-primary" style="background:linear-gradient(135deg,#8b0000,#dc2626);box-shadow:0 4px 24px rgba(220,38,38,0.4);">
        ← Back to Catalogue
      </a>
    </div>
  </div>
</div>
{% endblock %}
